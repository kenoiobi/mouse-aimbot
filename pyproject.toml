[project]
name = "kill-mouse"
version = "0.1.0"
description = "Semantic cursor snapping daemon — magnetically snap the OS cursor to detected UI elements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "target-finder-toolkit>=0.2.0",
  "numpy>=1.26.0",
  "opencv-python>=4.8.0,<5",
  "mss>=9.0.1",
  "ultralytics>=8.4.37",
  "pynput>=1.7.7",
  "PyQt6>=6.6.0",
  "pyautogui>=0.9.54",
]

[project.scripts]
kill-mouse = "kill_mouse.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kill_mouse*"]

[tool.uv]
package = true
